<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="Lovely_Style.css">
        
    </head> 
    <body>
        <!-- this is massage div -->
        <div class="container">
            <div >
                <h1 class = "header_text">? 🐽 รักกันมั๊ย 🐽 ?</h1>
            </div>
            <!--this is gif div --> 
            <div class="gif_container"> 
                <img src="https://i.postimg.cc/sfN9w1J0/pao-removebg-preview.png" alt="Cute animated illustration">
            </div>
            <!--This is buttons div -->
            <div class = "buttons"> 
                <button class="btn" id ="yesButton" onclick="nextPage()">รัก</button>
                <button class="btn" id="noButton" onmouseover="moveButton()">ไม่รัก</button>
                <script>
                    function nextPage() {
                        window.location.href = "yes.html";
                    }
                    
                    function moveButton() {
                        var x = Math.random() * (window.innerWidth - document.getElementById('noButton').offsetWidth) - 85;
                        var y = Math.random() * (window.innerHeight - document.getElementById('noButton').offsetHeight) - 48;
                        document.getElementById('noButton').style.left = `${x}px`;
                        document.getElementById('noButton').style.top = `${y}px`;
                    }
                </script> 
            </div>
        </div>
       
    </body> 
</html>
